site_name: AI-PLC Documentation
site_description: An AI-native product lifecycle for product managers
site_url: https://lasith-tekly.github.io/ai-plc/
repo_url: https://github.com/lasith-tekly/ai-plc
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Start here:
      - Overview: guide/start-here.md
      - "1. What is AI-PLC?": guide/what-is-ai-plc.md
      - "2. Install": guide/install.md
      - "3. Choose a run mode": guide/run-modes.md
      - "4. Your first run": guide/first-run.md
      - "5. Decision points": guide/gates.md
      - "6. What gets written": guide/files.md
      - "7. Connectors (optional)": MCP-SETUP.md
      - Help us test: guide/testing.md
  - Going deeper:
      - Lifecycle: guide/lifecycle.md
      - Troubleshooting: guide/troubleshooting.md
      - Glossary: guide/glossary.md
  - Customisation: customisation/index.md
  - Developer reference:
      - Overview: reference/index.md
      - Agents: reference/agents.md
      - Skills: reference/skills.md
      - Deliverables: reference/deliverables.md
      - Templates: reference/templates.md
      - Build the packages: reference/build.md
      - Test guide: TEST-GUIDE.md
  - Roadmap: roadmap.md
