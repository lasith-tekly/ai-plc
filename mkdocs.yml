site_name: AI-PLC Documentation
site_description: An AI-native product lifecycle for product managers
site_url: https://lasith-tekly.github.io/ai-plc/
repo_url: https://github.com/lasith-tekly/ai-plc
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Start here:
      - Overview: guide/start-here.md
      - "1. What is AI-PLC?": guide/what-is-ai-plc.md
      - "2. Install": guide/install.md
      - "3. Choose a run mode": guide/run-modes.md
      - "4. Your first run": guide/first-run.md
      - "5. Decision points": guide/gates.md
      - "6. What gets written": guide/files.md
      - "7. Connectors (optional)": MCP-SETUP.md
      - Feedback: guide/feedback.md
  - What it produces:
      - Overview: showcase/index.md
      - How each output is built: showcase/how-built.md
      - "Stage 1: Ideation": showcase/ideation.md
      - "Stage 2: Planning": showcase/planning.md
      - Decisions and reviews: showcase/decisions.md
      - The Outcome Pack: showcase/outcome-pack.md
      - Dependencies at every level: showcase/dependencies.md
      - Delivery material: showcase/delivery.md
      - Follow one outcome end to end: showcase/trace-one-outcome.md
      - Worked example (files): guide/worked-example.md
  - Going deeper:
      - The product lifecycle: guide/lifecycle.md
      - Troubleshooting: guide/troubleshooting.md
      - Glossary: guide/glossary.md
  - Customisation: customisation/index.md
  - Developer reference:
      - Overview: reference/index.md
      - Agents: reference/agents.md
      - Skills: reference/skills.md
      - Deliverables: reference/deliverables.md
      - Templates: reference/templates.md
      - Build the packages: reference/build.md
      - Test guide: TEST-GUIDE.md
  - Roadmap: roadmap.md
